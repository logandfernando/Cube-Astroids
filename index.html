<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blue Cube Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 40px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        #blueCube {
            width: 60px;
            height: 60px;
            background-color: #00d2ff;
            border-radius: 12px;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #00d2ff;
            cursor: grab;
        }
        #blueCube:active {
            cursor: grabbing;
        }
        .redCube {
            width: 40px;
            height: 40px;
            background-color: #ff2a6d;
            border-radius: 8px;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 0 15px #ff2a6d;
        }
        /* Game Over Screen styling */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 46, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #game-over-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over-screen h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ff2a6d;
            text-shadow: 0 0 10px #ff2a6d;
        }
        #game-over-screen p {
            font-size: 24px;
            margin-bottom: 20px;
        }
        #restart-btn {
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: #00d2ff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px #00d2ff;
            transition: transform 0.1s ease;
        }
        #restart-btn:hover {
            transform: scale(1.05);
        }
        #restart-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div>Score: <span id="score-val">0</span></div>
        <div>Lives: <span id="lives-val">1</span></div>
    </div>
    
    <div id="blueCube"></div>

    <!-- Interactive Game Over Menu Window Overlay -->
    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p>Final Score: <span id="final-score-val">0</span></p>
        <button id="restart-btn">Play Again</button>
    </div>

    <script>
        const blueCube = document.getElementById('blueCube');
        const scoreVal = document.getElementById('score-val');
        const livesVal = document.getElementById('lives-val');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreVal = document.getElementById('final-score-val');
        const restartBtn = document.getElementById('restart-btn');

        let score = 0;
        let lives = 1;
        let gameActive = true;
        let spawnInterval;
        let activeCubes = [];
        let playerX = window.innerWidth / 2;
        let isDraggingPlayer = false;
        let dragOffset = 0;

        // Initial alignment configuration setup
        blueCube.style.left = playerX - 30 + 'px';

        // Direct Player Dragging Logic
        function startDrag(clientX) {
            if (!gameActive) return;
            isDraggingPlayer = true;
            const rect = blueCube.getBoundingClientRect();
            dragOffset = clientX - (rect.left + 30);
        }

        function moveDrag(clientX) {
            if (!isDraggingPlayer || !gameActive) return;
            playerX = clientX - dragOffset;
            playerX = Math.max(30, Math.min(window.innerWidth - 30, playerX));
            blueCube.style.left = (playerX - 30) + 'px';
        }

        function stopDrag() {
            isDraggingPlayer = false;
        }

        // Mouse Event Hookups
        blueCube.addEventListener('mousedown', (e) => startDrag(e.clientX));
        window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
        window.addEventListener('mouseup', stopDrag);

        // Touch Event Hookups
        blueCube.addEventListener('touchstart', (e) => {
            startDrag(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            moveDrag(e.touches[0].clientX);
        }, { passive: true });
        window.addEventListener('touchend', stopDrag);

        function createRedCube() {
            if (!gameActive) return;
            const redCube = document.createElement('div');
            redCube.classList.add('redCube');
            
            const startX = Math.random() * (window.innerWidth - 40);
            let currentY = -40;
            const speed = 3 + Math.random() * 4 + (score * 0.1);
            
            redCube.style.left = startX + 'px';
            redCube.style.top = currentY + 'px';
            document.body.appendChild(redCube);

            const cubeData = { element: redCube, y: currentY, speed: speed, x: startX };

            const destroyHandler = function(e) {
                e.stopPropagation();
                if (!gameActive) return;
                score += 10;
                scoreVal.textContent = score;
                removeCube(cubeData);
            };

            redCube.addEventListener('mousedown', destroyHandler);
            redCube.addEventListener('touchstart', destroyHandler, { passive: true });

            activeCubes.push(cubeData);
        }

        function removeCube(cubeData) {
            if (cubeData.element.parentNode) {
                cubeData.element.remove();
            }
            const index = activeCubes.indexOf(cubeData);
            if (index > -1) activeCubes.splice(index, 1);
        }

        function clearAllCubes() {
            for (let i = activeCubes.length - 1; i >= 0; i--) {
                removeCube(activeCubes[i]);
            }
            activeCubes = [];
        }

        // Main game engine animation loop
        function updateGame() {
            if (!gameActive) return;
            const blueRect = blueCube.getBoundingClientRect();

            for (let i = activeCubes.length - 1; i >= 0; i--) {
                const cube = activeCubes[i];
                cube.y += cube.speed;
                cube.element.style.top = cube.y + 'px';

                const redRect = cube.element.getBoundingClientRect();

                // Hit detection collision logic with player cube
                if (redRect.bottom >= blueRect.top && 
                    redRect.top <= blueRect.bottom && 
                    redRect.right >= blueRect.left && 
                    redRect.left <= blueRect.right) {
                    
                    lives--;
                    livesVal.textContent = lives;
                    removeCube(cube);

                    if (lives <= 0) {
                        endGameEngine();
                    }
                    continue;
                }

                // Missed cube hits floor safely
                if (cube.y > window.innerHeight) {
                    removeCube(cube);
                }
            }
            requestAnimationFrame(updateGame);
        }

        function endGameEngine() {
            gameActive = false;
            clearInterval(spawnInterval);
            isDraggingPlayer = false;
            finalScoreVal.textContent = score;
            gameOverScreen.classList.add('visible');
        }

        function resetGame() {
            clearAllCubes();
            score = 0;
            lives = 1;
            scoreVal.textContent = score;
            livesVal.textContent = lives;
            gameActive = true;
            playerX = window.innerWidth / 2;
            blueCube.style.left = (playerX - 30) + 'px';
            gameOverScreen.classList.remove('visible');
            
            clearInterval(spawnInterval);
            spawnInterval = setInterval(createRedCube, 800);
            requestAnimationFrame(updateGame);
        }

        // Event listener hookup configuration for UI reset loop interaction
        restartBtn.addEventListener('click', resetGame);

        // Start initialization sequence invocation 
        resetGame();
    </script>
</body>
</html>
