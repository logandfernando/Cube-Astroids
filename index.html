<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blue Cube Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            display: flex;
            gap: 40px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            display: none;
        }
        #blueCube {
            width: 60px;
            height: 60px;
            background-color: #00d2ff;
            border-radius: 12px;
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 20px #00d2ff;
            cursor: grab;
            display: none;
        }
        #blueCube:active {
            cursor: grabbing;
        }
        .redCube {
            width: 40px;
            height: 40px;
            background-color: #ff2a6d;
            border-radius: 8px;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 0 15px #ff2a6d;
        }
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .menu-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .menu-screen h1 {
            font-size: 48px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #start-screen h1 {
            color: #00d2ff;
            text-shadow: 0 0 15px #00d2ff;
        }
        #game-over-screen h1 {
            color: #ff2a6d;
            text-shadow: 0 0 15px #ff2a6d;
        }
        .menu-screen p {
            font-size: 20px;
            margin-bottom: 30px;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
            color: #a0a0ba;
        }
        .menu-btn {
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        #start-btn {
            background-color: #00d2ff;
            box-shadow: 0 0 20px #00d2ff;
        }
        #restart-btn {
            background-color: #ff2a6d;
            box-shadow: 0 0 20px #ff2a6d;
        }
        .menu-btn:hover {
            transform: scale(1.05);
        }
        .menu-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div>Score: <span id="score-val">0</span></div>
        <div>Lives: <span id="lives-val">1</span></div>
    </div>
    
    <div id="blueCube"></div>

    <div id="start-screen" class="menu-screen visible">
        <h1>Blue Cube Game</h1>
        <p>Drag the Blue Cube to avoid falling red cubes.<br>Tap or click the falling red cubes to destroy them for points!</p>
        <button id="start-btn" class="menu-btn">Start Game</button>
    </div>

    <div id="game-over-screen" class="menu-screen">
        <h1>Game Over</h1>
        <p>Final Score: <span id="final-score-val">0</span></p>
        <button id="restart-btn" class="menu-btn">Play Again</button>
    </div>

    <script>
        const [b, u, s, l, ss, sb, go, fs, rb] = ['blueCube', 'ui-layer', 'score-val', 'lives-val', 'start-screen', 'start-btn', 'game-over-screen', 'final-score-val', 'restart-btn'].map(id => document.getElementById(id));
        let score = 0, lives = 1, active = false, timer, cubes = [], px = window.innerWidth / 2, drag = false, offset = 0;
        function dragS(x) { if (!active) return; drag = true; offset = x - (b.getBoundingClientRect().left + 30); }
        function dragM(x) { if (!drag || !active) return; px = Math.max(30, Math.min(window.innerWidth - 30, x - offset)); b.style.left = (px - 30) + 'px'; }
        b.addEventListener('mousedown', e => dragS(e.clientX)); window.addEventListener('mousemove', e => dragM(e.clientX)); window.addEventListener('mouseup', () => drag = false); b.addEventListener('touchstart', e => dragS(e.touches[0].clientX), {passive:true}); window.addEventListener('touchmove', e => dragM(e.touches[0].clientX), {passive:true}); window.addEventListener('touchend', () => drag = false);
        function spawn() { if (!active) return; const e = document.createElement('div'); e.className = 'redCube'; const sx = Math.random() * (window.innerWidth - 40); let sy = -40; const sp = 3 + Math.random() * 4 + (score * 0.1); e.style.left = sx + 'px'; e.style.top = sy + 'px'; document.body.appendChild(e); const data = {e, y: sy, sp}; e.addEventListener('mousedown', ev => { ev.stopPropagation(); if (active) { score += 10; s.textContent = score; rem(data); } }); e.addEventListener('touchstart', ev => { ev.stopPropagation(); if (active) { score += 10; s.textContent = score; rem(data); } }, {passive:true}); cubes.push(data); }
        function rem(d) { if (d.e.parentNode) d.e.remove(); const i = cubes.indexOf(d); if (i > -1) cubes.splice(i, 1); }
        function loop() { if (!active) return; const br = b.getBoundingClientRect(); for (let i = cubes.length - 1; i >= 0; i--) { const c = cubes[i]; c.y += c.sp; c.e.style.top = c.y + 'px'; const rr = c.e.getBoundingClientRect(); if (rr.bottom >= br.top && rr.top <= br.bottom && rr.right >= br.left && rr.left <= br.right) { lives--; l.textContent = lives; rem(c); if (lives <= 0) { active = false; clearInterval(timer); b.style.display = 'none'; u.style.display = 'none'; fs.textContent = score; go.classList.add('visible'); } continue; } if (c.y > window.innerHeight) rem(c); } requestAnimationFrame(loop); }
        function start() { cubes.forEach(rem); cubes = []; score = 0; lives = 1; s.textContent = 0; l.textContent = 1; active = true; px = window.innerWidth / 2; b.style.left = (px - 30) + 'px'; ss.classList.remove('visible'); go.classList.remove('visible'); b.style.display = 'block'; u.style.display = 'flex'; clearInterval(timer); timer = setInterval(spawn, 800); requestAnimationFrame(loop); }
        sb.addEventListener('click', start); rb.addEventListener('click', start);
    </script>
</body>
</html>
