# Giant Blue Start Button

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Button</title>
    <style>
        .start-button {
            display: inline-block;
            padding: 20px 40px;
            font-size: 24px;
            color: white;
            background-color: blue;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .start-button:hover {
            background-color: darkblue;
        }
    </style>
</head>
<body>
    <a href="code.html" class="start-button">Start</a>
</body>
</html>
